# nginx vhost for taxes.gerra.sh — pushed by scripts/push-conf.sh
#
# Cert (once, after the DNS A record exists):
#   ssh hetzner_gb 'certbot certonly --nginx -d taxes.gerra.sh'
# Always `certonly` — never bare `certbot --nginx` (its installer injects
# duplicate server blocks; see fintrack's deploy notes).

server {
    server_name taxes.gerra.sh;
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    include /opt/ssl-manager/web_server_includes/nginx_well_known_service_template.conf;

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/taxes.gerra.sh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taxes.gerra.sh/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name taxes.gerra.sh;

    # Redirect scoped to location / so the ACME .well-known include stays reachable
    location / {
        return 301 https://taxes.gerra.sh$request_uri;
    }

    include /opt/ssl-manager/web_server_includes/nginx_well_known_service_template.conf;
}
