[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "web/node_modules"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # function calls in default args (Flask patterns use this)
    "SIM108", # ternary operator — not always more readable
]

[tool.ruff.lint.isort]
known-first-party = ["core", "blueprints", "engine"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
